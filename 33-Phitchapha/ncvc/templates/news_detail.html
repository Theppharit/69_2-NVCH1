{% extends "base.html" %}{% block title %}{{ n.title }}{% endblock %}{% block content %}<article class="max-w-3xl mx-auto px-4 mt-10">
<span class="text-sm text-brand">{{ n.category|default:"" }} · {{ n.published|date:"j F Y" }}</span><h1 class="text-3xl font-semibold mt-2">{{ n.title }}</h1>
{% if n.cover %}<img src="{{ n.cover.url }}" class="rounded-xl mt-6 w-full" alt="">{% endif %}<div class="mt-6 leading-8">{{ n.body|safe }}</div></article>{% endblock %}

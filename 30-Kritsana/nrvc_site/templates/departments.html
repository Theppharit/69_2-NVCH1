{% extends "base.html" %}
{% block title %}แผนกวิชา | {{ site.name_th }}{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto px-4 pt-10">
  <h1 class="font-head text-3xl font-semibold text-ink">แผนกวิชา</h1>
  <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 mt-6">
    {% for d in departments %}
    <div class="border bg-white">
      <div class="aspect-[16/9] bg-slate-200">
        {% if d.image %}<img src="{{ d.image.url }}" alt="" class="w-full h-full object-cover">
        {% else %}<div class="w-full h-full bg-gradient-to-br from-ink to-slate-500"></div>{% endif %}
      </div>
      <div class="p-4"><h2 class="font-head font-medium text-ink text-lg">{{ d.name }}</h2>
        <p class="mt-1 text-slate-600">{{ d.description }}</p></div>
    </div>
    {% empty %}<p class="text-slate-500">ยังไม่มีข้อมูลแผนกวิชา</p>{% endfor %}
  </div>
</div>
{% endblock %}

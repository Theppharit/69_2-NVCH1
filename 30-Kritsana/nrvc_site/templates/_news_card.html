<a href="{{ n.get_absolute_url }}" class="group block bg-white border hover:border-brand transition-colors">
  <div class="aspect-[16/10] bg-slate-200 overflow-hidden">
    {% if n.image %}<img src="{{ n.image.url }}" alt="" class="w-full h-full object-cover">
    {% else %}<div class="w-full h-full bg-gradient-to-br from-ink to-slate-500"></div>{% endif %}
  </div>
  <div class="p-4">
    <p class="text-sm text-slate-500">{{ n.published_at|date:"j F Y" }}{% if n.category %} · {{ n.category }}{% endif %}</p>
    <h3 class="mt-1 font-head font-medium text-ink group-hover:text-brand">{{ n.title }}</h3>
  </div>
</a>

{% extends 'base.html' %}
{% block title %}{{ page.title }} | {{ site.name_th }}{% endblock %}

{% block content %}
<section class="bg-brand-700 text-white">
  <div class="max-w-7xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold">{{ page.title }}</h1>
  </div>
</section>
<div class="max-w-4xl mx-auto px-4 pt-8">
  <article class="rounded-2xl bg-white p-6 sm:p-10 ring-1 ring-slate-200">
    <div class="content-body">{{ page.content|safe }}</div>
  </article>
</div>
{% endblock %}

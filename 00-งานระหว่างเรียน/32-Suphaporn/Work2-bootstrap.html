<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suphaporn Coffee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f3efe9; }
    .navbar-coffee { background-color: #3b2a20; }
    .btn-coffee { background-color: #6f4e37; border-color: #6f4e37; color: #fff; }
    .btn-coffee:hover { background-color: #5a3e2b; border-color: #5a3e2b; color: #fff; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-coffee">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Suphaporn Coffee</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="#">หน้าแรก</a></li>
        <li class="nav-item"><a class="nav-link" href="#">เมนูกาแฟ</a></li>
        <li class="nav-item"><a class="nav-link" href="#">โปรโมชั่น</a></li>
        <li class="nav-item"><a class="nav-link" href="#order">ติดต่อเรา</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ฟอร์มสั่งซื้อ -->
<div class="container my-5" id="order">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <h2 class="mb-4">สั่งกาแฟออนไลน์</h2>

      <form class="needs-validation" novalidate>

        <!-- ช่องข้อความ -->
        <div class="mb-3">
          <label for="fullname" class="form-label">ชื่อ-นามสกุล</label>
          <input type="text" class="form-control" id="fullname" placeholder="เช่น สุภาภรณ์ ใจดี" required>
          <div class="invalid-feedback">กรุณากรอกชื่อ-นามสกุล</div>
          <div class="valid-feedback">ถูกต้อง</div>
        </div>

        <!-- Select -->
        <div class="mb-3">
          <label for="menu" class="form-label">เลือกเมนู</label>
          <select class="form-select" id="menu" required>
            <option selected disabled value="">เลือกเมนูกาแฟ...</option>
            <option>ลาเต้</option>
            <option>อเมริกาโน่</option>
            <option>มัจฉะ</option>
          </select>
          <div class="invalid-feedback">กรุณาเลือกเมนู</div>
        </div>

        <!-- Radio -->
        <div class="mb-3">
          <label class="form-label d-block">รูปแบบการรับสินค้า</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="receive" id="pickup" required>
            <label class="form-check-label" for="pickup">รับที่ร้าน</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="receive" id="delivery" required>
            <label class="form-check-label" for="delivery">จัดส่ง</label>
            <div class="invalid-feedback">กรุณาเลือกรูปแบบการรับสินค้า</div>
          </div>
        </div>

        <!-- Textarea -->
        <div class="mb-3">
          <label for="address" class="form-label">ที่อยู่จัดส่ง / หมายเหตุ</label>
          <textarea class="form-control" id="address" rows="3" placeholder="ที่อยู่หรือรายละเอียดเพิ่มเติม" required></textarea>
          <div class="invalid-feedback">กรุณากรอกที่อยู่หรือหมายเหตุ</div>
        </div>

        <!-- Checkbox -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="agree" required>
          <label class="form-check-label" for="agree">ยอมรับเงื่อนไขการสั่งซื้อ</label>
          <div class="invalid-feedback">คุณต้องยอมรับเงื่อนไขก่อนส่งแบบฟอร์ม</div>
        </div>

        <button class="btn btn-coffee" type="submit">ส่งแบบฟอร์ม</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ตรวจสอบฟอร์มก่อนส่ง
  (() => {
    'use strict';
    document.querySelectorAll('.needs-validation').forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      });
    });
  })();
</script>
</body>
</html>
